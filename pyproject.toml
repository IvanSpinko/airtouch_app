[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gesture-control"
version = "1.1.0"
description = "AirTouch: control a Windows PC with hand gestures via webcam"
requires-python = ">=3.11"

[project.scripts]
airtouch = "gesture_control.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
